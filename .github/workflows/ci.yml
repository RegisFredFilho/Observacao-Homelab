
name: Infra Observability CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

      - name: Validate dashboard JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dashboards = list(Path("dashboards").glob("*.json"))
          if not dashboards:
    print("No dashboards committed yet; skipping validation.")

          for dashboard in dashboards:
              with dashboard.open(encoding="utf-8") as file:
                  json.load(file)
              print(f"Valid JSON: {dashboard}")
          PY
