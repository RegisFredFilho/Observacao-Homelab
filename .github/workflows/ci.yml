
name: Infra Observability CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip show pytest

      - name: Run pytest
        run: |
          python -m pytest -v

      - name: Validate dashboard JSON
        shell: bash
        run: |
          found=0
          for file in dashboards/*.json; do
            if [ -f "$file" ]; then
              python -m json.tool "$file" > /dev/null
              echo "[OK] Valid JSON: $file"
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "No dashboards committed yet; skipping validation."
          fi
